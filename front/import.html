<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>掌柜智库 · 教育版 - 知识库导入</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f54eb'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23ffffff' font-family='Microsoft YaHei, sans-serif'%3E%E6%99%BA%3C/text%3E%3C/svg%3E" />
  <style>
    /* ============ 设计令牌（与智能问答页共用语言） ============ */
    :root {
      --c-bg: #f4f6fa;
      --c-panel: #ffffff;
      --c-line: #e5e9f0;
      --c-line-soft: #eef1f6;
      --c-text: #1c2534;
      --c-text-2: #5b6474;
      --c-text-3: #79818f;
      --c-accent: #2f54eb;
      --c-accent-hover: #2348d8;
      --c-accent-soft: #eef1fe;
      --c-accent-soft-2: #e3e8fd;
      --c-danger: #d5483b;
      --c-danger-soft: #fdeeed;
      --c-success: #0c9d6d;
      --c-focus: rgba(47, 84, 235, 0.22);
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 18px;
      --sh-panel: 0 1px 2px rgba(23, 32, 52, 0.04), 0 14px 40px -18px rgba(23, 32, 52, 0.16);
      --sh-card: 0 1px 2px rgba(23, 32, 52, 0.04), 0 10px 28px -18px rgba(23, 32, 52, 0.14);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      color: var(--c-text);
      background-color: var(--c-bg);
      background-image:
        radial-gradient(1200px 420px at 50% -160px, rgba(47, 84, 235, 0.06), transparent 70%);
      background-repeat: no-repeat;
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; }

    /* ============ 顶部导航（两页共用） ============ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--c-line);
    }
    .topbar-inner {
      max-width: 920px;
      margin: 0 auto;
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 9px;
      background: var(--c-accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 2px 6px -2px rgba(47, 84, 235, 0.55);
    }
    .brand-mark svg { width: 16px; height: 16px; }
    .brand-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
    .brand-tag {
      flex: none;
      font-size: 11px;
      font-weight: 600;
      color: var(--c-accent);
      background: var(--c-accent-soft);
      border: 1px solid var(--c-accent-soft-2);
      border-radius: 999px;
      padding: 1px 8px;
      white-space: nowrap;
    }
    .nav { display: flex; align-items: center; gap: 4px; }
    .nav-item {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--c-text-2);
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 999px;
      transition: color 0.15s ease, background-color 0.15s ease;
      white-space: nowrap;
    }
    .nav-item:hover { color: var(--c-text); background: var(--c-line-soft); }
    .nav-item.is-active { color: var(--c-accent); background: var(--c-accent-soft); font-weight: 600; }
    .nav-item:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 1px; }

    /* ============ 页面主体 ============ */
    main {
      flex: 1 1 auto;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 30px 20px 40px;
    }

    .page-title { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: 0.01em; }
    .page-desc { margin: 6px 0 0; font-size: 13.5px; color: var(--c-text-2); max-width: 660px; }

    /* ============ 上传区 ============ */
    .drop-zone {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
      padding: 44px 24px 40px;
      background: var(--c-panel);
      border: 1.5px dashed #c3cbda;
      border-radius: var(--r-lg);
      cursor: pointer;
      transition: border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease, transform 0.08s ease;
      outline: none;
    }
    .drop-zone:hover { border-color: var(--c-accent); background: #fbfcff; }
    .drop-zone.is-dragging {
      border-color: var(--c-accent);
      background: var(--c-accent-soft);
      box-shadow: inset 0 0 0 1px var(--c-accent), var(--sh-float, 0 8px 24px -14px rgba(47, 84, 235, 0.35));
    }
    .drop-zone:active { transform: scale(0.998); }
    .drop-zone:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 3px; }

    .drop-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--c-accent);
      background: var(--c-accent-soft);
      margin-bottom: 6px;
      transition: transform 0.18s ease;
    }
    .drop-zone:hover .drop-icon, .drop-zone.is-dragging .drop-icon { transform: translateY(-2px); }
    .drop-icon svg { width: 26px; height: 26px; }
    .drop-main { font-size: 15px; font-weight: 600; color: var(--c-text); }
    .drop-sub { font-size: 13px; color: var(--c-text-3); }
    .drop-sub b { color: var(--c-text-2); font-weight: 600; }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ============ 任务区 ============ */
    .task-section { margin-top: 34px; }
    .task-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .task-title { margin: 0; font-size: 16px; font-weight: 600; }
    .task-hint { font-size: 12.5px; color: var(--c-text-3); }

    .file-list { display: flex; flex-direction: column; gap: 14px; }

    .file-empty {
      background: var(--c-panel);
      border: 1px solid var(--c-line);
      border-radius: var(--r-md);
      padding: 42px 20px;
      text-align: center;
      color: var(--c-text-3);
      font-size: 13.5px;
    }
    .file-empty svg {
      width: 26px;
      height: 26px;
      color: #aeb6c4;
      margin-bottom: 8px;
    }
    .file-empty .file-empty-main { color: var(--c-text-2); font-weight: 500; margin: 0 0 2px; }

    /* 任务卡片 */
    .file-item {
      background: var(--c-panel);
      border: 1px solid var(--c-line);
      border-radius: var(--r-md);
      box-shadow: var(--sh-card);
      padding: 16px 18px 12px;
      animation: card-in 0.3s ease both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .file-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .file-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .file-type {
      flex: none;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--c-text-2);
      background: var(--c-line-soft);
      border: 1px solid var(--c-line);
      border-radius: 6px;
      padding: 2px 6px;
      line-height: 1.4;
    }
    .file-name {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--c-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      word-break: break-all;
    }
    .file-head-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
    .file-size { font-size: 12px; color: var(--c-text-3); font-variant-numeric: tabular-nums; }

    /* 状态徽标 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: opacity 0.15s ease;
    }
    .status-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: none;
      border-radius: 50%;
      background: currentColor;
    }
    .status-uploading { color: #9a6100; background: #fdf3de; border-color: #f5e2b8; }
    .status-processing { color: #2549d4; background: var(--c-accent-soft); border-color: #dce3fd; }
    .status-processing::before { animation: pulse-dot 1.1s ease-in-out infinite; }
    .status-completed { color: #0b7d52; background: #e7f7f0; border-color: #cdeee0; }
    .status-error { color: #b42318; background: var(--c-danger-soft); border-color: #f6d7d3; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }

    /* 进度条 */
    .progress-wrapper { display: none; margin-top: 14px; }
    .progress-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .progress-label { font-size: 12px; color: var(--c-text-3); }
    .progress-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--c-text-2);
      font-variant-numeric: tabular-nums;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--c-line-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--c-accent), #5b7bf2);
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
    }

    /* 运行日志 */
    .log-details {
      margin-top: 12px;
      border-top: 1px dashed var(--c-line);
      padding-top: 10px;
    }
    .log-details summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--c-text-2);
      outline: none;
      border-radius: 6px;
      transition: color 0.15s ease;
    }
    .log-details summary::-webkit-details-marker { display: none; }
    .log-details summary:hover { color: var(--c-accent); }
    .log-details summary:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
    .log-details summary::after {
      content: "";
      margin-left: auto;
      width: 7px;
      height: 7px;
      border-right: 1.6px solid var(--c-text-3);
      border-bottom: 1.6px solid var(--c-text-3);
      transform: rotate(-45deg);
      transition: transform 0.2s ease, border-color 0.15s ease;
      flex: none;
    }
    .log-details[open] summary::after { transform: rotate(45deg) translate(-1px, -1px); }

    .log-list {
      margin: 10px 0 2px;
      padding: 0;
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .log-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px 7px 4px;
      font-size: 13px;
      color: var(--c-text-2);
      border-radius: 8px;
      min-width: 0;
      transition: background-color 0.15s ease;
    }
    .log-list li::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: none;
      border-radius: 50%;
      background: #b8c0cd;
    }
    .log-list li:hover { background: var(--c-line-soft); }
    .log-list li > span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .log-done { color: var(--c-text-2); }
    .log-done::before { background: var(--c-success); }
    .log-running { color: var(--c-accent); }
    .log-running::before { background: var(--c-accent); animation: pulse-dot 1.1s ease-in-out infinite; }
    .log-error { color: var(--c-danger); }
    .log-error::before { background: var(--c-danger); }

    .log-duration {
      margin-left: auto;
      flex: none;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--c-text-2);
      background: var(--c-line-soft);
      border: 1px solid var(--c-line);
      padding: 1px 9px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .log-list::-webkit-scrollbar { width: 6px; }
    .log-list::-webkit-scrollbar-thumb { background: #d4dae4; border-radius: 3px; }
    .log-list::-webkit-scrollbar-thumb:hover { background: #b9c1cf; }

    /* ============ 页脚 ============ */
    .page-foot {
      flex: none;
      border-top: 1px solid var(--c-line);
      background: rgba(255, 255, 255, 0.6);
      padding: 16px 20px;
      text-align: center;
      font-size: 12px;
      color: var(--c-text-3);
    }

    /* ============ 响应式 & 动效偏好 ============ */
    @media (max-width: 640px) {
      .topbar-inner { padding: 0 14px; }
      .brand-tag { display: none; }
      main { padding: 20px 14px 28px; }
      .drop-zone { padding: 32px 16px 28px; }
      .task-section-head { flex-direction: column; align-items: flex-start; gap: 2px; }
      .file-head { flex-direction: column; }
      .file-head-side { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/import" aria-label="掌柜智库 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">掌柜智库</span>
          <span class="brand-tag">教育版</span>
        </span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a class="nav-item is-active" href="/import" aria-current="page">知识库导入</a>
        <a class="nav-item" href="/query">智能问答</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-intro">
      <h1 class="page-title">知识库文件导入</h1>
      <p class="page-desc">上传课程文档（PDF / Markdown），系统将自动完成文本抽取、题目识别与向量化入库，构建可被智能问答检索的教育知识库。</p>
    </section>

    <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="选择或拖拽文件上传，支持 PDF 与 Markdown">
      <span class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 16 12 12 8 16"/>
          <line x1="12" y1="12" x2="12" y2="21"/>
          <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
        </svg>
      </span>
      <span class="drop-main">拖拽文件到此处，或点击选择文件</span>
      <span class="drop-sub">支持 <b>PDF</b> 与 <b>Markdown</b> 文档，可一次选择多个文件</span>
      <input type="file" id="fileInput" class="file-input" accept=".pdf,.md" multiple />
    </div>

    <section class="task-section">
      <div class="task-section-head">
        <h2 class="task-title">导入任务</h2>
        <span class="task-hint">任务在服务端异步执行，关闭页面不会中断处理</span>
      </div>
      <div id="fileList" class="file-list">
        <div class="file-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
            <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
          </svg>
          <p class="file-empty-main">暂无导入任务</p>
          <p>上传 PDF 或 Markdown 文件，处理进度将实时显示在这里</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="page-foot">掌柜智库 · 教育版　|　本地教育知识库检索问答工具</footer>

  <script>
    (function () {
      "use strict";

      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const fileList = document.getElementById("fileList");

      // 后端地址（服务默认运行在本机 8000 端口）
      const API_BASE = "http://127.0.0.1:8000";

      // 常见处理节点 → 中文名（未知节点原样展示）
      const NODE_NAMES = {
        pdf_to_md: "PDF 转 Markdown",
        md_img: "图片抽取迁移",
        ducment_split: "文档切片",
        document_split: "文档切片",
        item_name_recognition: "题目识别",
        bge_embedding: "向量化嵌入",
        entry: "任务编排",
        import_milvus: "Milvus 向量入库"
      };

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function formatSize(bytes) {
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1024 / 1024).toFixed(2) + " MB";
      }

      function formatDuration(seconds) {
        if (seconds < 60) return seconds.toFixed(1) + "s";
        const mins = Math.floor(seconds / 60);
        const secs = Math.round(seconds % 60);
        return mins + "m" + secs + "s";
      }

      function nodeLabel(id) {
        return NODE_NAMES[id] || id;
      }

      function removeEmptyState() {
        fileList.querySelectorAll(".file-empty").forEach(function (node) { node.remove(); });
      }

      // ---- 拖拽 / 点击 / 键盘 ----
      let dragDepth = 0;

      dropZone.addEventListener("click", function () { fileInput.click(); });
      dropZone.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          fileInput.click();
        }
      });
      dropZone.addEventListener("dragenter", function (e) {
        e.preventDefault();
        dragDepth++;
        dropZone.classList.add("is-dragging");
      });
      dropZone.addEventListener("dragover", function (e) {
        e.preventDefault();
        dropZone.classList.add("is-dragging");
      });
      dropZone.addEventListener("dragleave", function () {
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) dropZone.classList.remove("is-dragging");
      });
      dropZone.addEventListener("drop", function (e) {
        e.preventDefault();
        dragDepth = 0;
        dropZone.classList.remove("is-dragging");
        handleFiles(e.dataTransfer.files);
      });

      fileInput.addEventListener("change", function (e) {
        handleFiles(e.target.files);
        fileInput.value = "";
      });

      function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
      }

      // ---- 上传单个文件 ----
      async function uploadFile(file) {
        const isPDF = file.name.toLowerCase().endsWith(".pdf");
        // PDF 需要 8 步，MD 跳过 pdf_to_md 需要 7 步（与后端节点数一致）
        const totalNodes = isPDF ? 8 : 7;

        const id = "file-" + Math.random().toString(36).substr(2, 8);
        removeEmptyState();

        const html =
          '<div class="file-item" id="' + id + '">' +
            '<div class="file-head">' +
              '<div class="file-title">' +
                '<span class="file-type">' + (isPDF ? "PDF" : "MD") + "</span>" +
                '<span class="file-name" title="' + esc(file.name) + '">' + esc(file.name) + "</span>" +
              "</div>" +
              '<div class="file-head-side">' +
                '<span class="file-size">' + formatSize(file.size) + "</span>" +
                '<span class="status-badge status-uploading">上传中…</span>' +
              "</div>" +
            "</div>" +
            '<div class="progress-wrapper">' +
              '<div class="progress-meta">' +
                '<span class="progress-label">导入进度</span>' +
                '<span class="progress-text">0%</span>' +
              "</div>" +
              '<div class="progress-bar-container"><div class="progress-bar"></div></div>' +
            "</div>" +
            '<details class="log-details" open>' +
              "<summary>准备上传…</summary>" +
              '<ul class="log-list"></ul>' +
            "</details>" +
          "</div>";
        fileList.insertAdjacentHTML("afterbegin", html);

        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector(".status-badge");
        const progressWrapper = itemEl.querySelector(".progress-wrapper");
        const logListEl = itemEl.querySelector(".log-list");
        const logSummary = itemEl.querySelector(".log-details summary");

        const formData = new FormData();
        formData.append("file", file);

        try {
          progressWrapper.style.display = "block";

          // 上传阶段约占 1 个节点
          const uploadPercentage = (1 / totalNodes) * 100;
          updateProgressUI(progressWrapper, Math.min(uploadPercentage, 10));

          const initialLog = document.createElement("li");
          initialLog.textContent = "开始上传文件…";
          initialLog.className = "log-running";
          logListEl.appendChild(initialLog);

          const response = await fetch(API_BASE + "/upload", { method: "POST", body: formData });
          if (!response.ok) throw new Error("Upload failed");

          const result = await response.json();
          const taskId = result.task_id;

          updateProgressUI(progressWrapper, uploadPercentage);
          statusBadge.textContent = "处理中";
          statusBadge.className = "status-badge status-processing";
          logSummary.textContent = "任务已提交，等待流水线启动…";

          pollStatus(taskId, itemEl, totalNodes);
        } catch (error) {
          console.error(error);
          statusBadge.textContent = "上传失败";
          statusBadge.className = "status-badge status-error";
          updateProgressUI(progressWrapper, 0);

          const errLog = document.createElement("li");
          errLog.textContent = "网络请求失败或服务器异常";
          errLog.className = "log-error";
          logListEl.appendChild(errLog);
        }
      }

      // ---- 进度渲染 ----
      function updateProgressUI(wrapper, percentage) {
        const bar = wrapper.querySelector(".progress-bar");
        const text = wrapper.querySelector(".progress-text");
        const safe = Math.min(Math.max(percentage, 0), 100);

        bar.style.width = safe + "%";
        text.textContent = Math.round(safe) + "%";

        if (safe >= 100) {
          bar.style.background = "linear-gradient(90deg, #0c9d6d, #3cc896)";
        } else if (safe < 10) {
          bar.style.background = "linear-gradient(90deg, #e0a11e, #f0c04f)";
        } else {
          bar.style.background = "linear-gradient(90deg, #2f54eb, #5b7bf2)";
        }
      }

      // ---- 轮询渲染日志并计算进度 ----
      function renderLogsAndCalculateProgress(itemEl, doneList, runningList, totalNodes, durations) {
        const logSummary = itemEl.querySelector(".log-details summary");
        const logListEl = itemEl.querySelector(".log-list");

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const durationMap = durations || {};

        // 已完成节点数 / 总节点数
        let currentPercentage = (done.length / totalNodes) * 100;
        if (running.length > 0) currentPercentage += (0.5 / totalNodes) * 100;
        if (currentPercentage >= 100) currentPercentage = 95;

        let totalDuration = 0;
        for (const key in durationMap) totalDuration += durationMap[key];
        const durationText = totalDuration > 0 ? "，总耗时 " + formatDuration(totalDuration) : "";

        logSummary.textContent =
          "运行日志（已完成 " + done.length + "，进行中 " + running.length +
          "，共 " + totalNodes + " 步" + durationText + "）";

        logListEl.innerHTML = "";

        for (const item of done) {
          if (item === "upload_file") continue;
          const li = document.createElement("li");
          const nameSpan = document.createElement("span");
          nameSpan.textContent = nodeLabel(item) + " 节点执行完成";
          li.appendChild(nameSpan);
          if (durationMap[item] !== undefined) {
            const durationSpan = document.createElement("span");
            durationSpan.className = "log-duration";
            durationSpan.textContent = formatDuration(durationMap[item]);
            li.appendChild(durationSpan);
          }
          li.className = "log-done";
          logListEl.appendChild(li);
        }

        for (const item of running) {
          const li = document.createElement("li");
          const nameSpan = document.createElement("span");
          nameSpan.textContent = "正在处理 " + nodeLabel(item) + " 节点…";
          li.appendChild(nameSpan);
          li.className = "log-running";
          logListEl.appendChild(li);
        }

        logListEl.scrollTop = logListEl.scrollHeight;
        return currentPercentage;
      }

      // ---- 轮询任务状态 ----
      function pollStatus(taskId, itemEl, totalNodes) {
        const statusBadge = itemEl.querySelector(".status-badge");
        const progressWrapper = itemEl.querySelector(".progress-wrapper");
        const logDetails = itemEl.querySelector(".log-details");
        let stopped = false;

        const interval = setInterval(async function () {
          if (stopped) return;
          try {
            const res = await fetch(API_BASE + "/status/" + taskId);
            if (!res.ok) throw new Error("Status request failed");

            const data = await res.json();
            if (stopped) return;

            const calculatedPercentage = renderLogsAndCalculateProgress(
              itemEl, data.done_list, data.running_list, totalNodes, data.durations);

            if (data.status === "completed") {
              stopped = true;
              clearInterval(interval);
              statusBadge.textContent = "已完成";
              statusBadge.className = "status-badge status-completed";
              updateProgressUI(progressWrapper, 100);

              setTimeout(function () { logDetails.open = false; }, 1200);
            } else if (data.status === "failed") {
              stopped = true;
              clearInterval(interval);
              statusBadge.textContent = "失败";
              statusBadge.className = "status-badge status-error";

              const logListEl = itemEl.querySelector(".log-list");
              const errLog = document.createElement("li");
              errLog.textContent = "工作流执行失败，任务已中止";
              errLog.className = "log-error";
              logListEl.appendChild(errLog);
            } else if (data.status === "processing") {
              updateProgressUI(progressWrapper, calculatedPercentage);
            }
          } catch (e) {
            console.error("Polling error", e);
          }
        }, 1500);
      }
    })();
  </script>
</body>
</html>
