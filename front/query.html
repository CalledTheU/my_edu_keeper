<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>掌柜智库 · 教育版 - 智能问答</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f54eb'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23ffffff' font-family='Microsoft YaHei, sans-serif'%3E%E6%99%BA%3C/text%3E%3C/svg%3E" />
  <style>
    /* ============ 设计令牌 ============ */
    :root {
      --c-bg: #f4f6fa;
      --c-panel: #ffffff;
      --c-line: #e5e9f0;
      --c-line-soft: #eef1f6;
      --c-text: #1c2534;
      --c-text-2: #5b6474;
      --c-text-3: #79818f;
      --c-accent: #2f54eb;
      --c-accent-hover: #2348d8;
      --c-accent-active: #1b3bc0;
      --c-accent-soft: #eef1fe;
      --c-accent-soft-2: #e3e8fd;
      --c-danger: #d5483b;
      --c-danger-soft: #fdeeed;
      --c-success: #0c9d6d;
      --c-focus: rgba(47, 84, 235, 0.22);
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 18px;
      --sh-panel: 0 1px 2px rgba(23, 32, 52, 0.04), 0 14px 40px -18px rgba(23, 32, 52, 0.16);
      --sh-float: 0 6px 18px -10px rgba(23, 32, 52, 0.18);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      color: var(--c-text);
      background-color: var(--c-bg);
      background-image:
        radial-gradient(1200px 420px at 50% -160px, rgba(47, 84, 235, 0.06), transparent 70%);
      background-repeat: no-repeat;
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; }
    code { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }

    /* ============ 顶部导航（两页共用语言） ============ */
    .topbar {
      flex: none;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--c-line);
      position: relative;
      z-index: 10;
    }
    .topbar-inner {
      max-width: 1000px;
      margin: 0 auto;
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 9px;
      background: var(--c-accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 2px 6px -2px rgba(47, 84, 235, 0.55);
    }
    .brand-mark svg { width: 16px; height: 16px; }
    .brand-text {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
    .brand-tag {
      flex: none;
      font-size: 11px;
      font-weight: 600;
      color: var(--c-accent);
      background: var(--c-accent-soft);
      border: 1px solid var(--c-accent-soft-2);
      border-radius: 999px;
      padding: 1px 8px;
      white-space: nowrap;
    }
    .nav { display: flex; align-items: center; gap: 4px; }
    .nav-item {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--c-text-2);
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 999px;
      transition: color 0.15s ease, background-color 0.15s ease;
      white-space: nowrap;
    }
    .nav-item:hover { color: var(--c-text); background: var(--c-line-soft); }
    .nav-item.is-active { color: var(--c-accent); background: var(--c-accent-soft); font-weight: 600; }
    .nav-item:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 1px; }

    /* ============ 页面结构 ============ */
    .page { display: flex; flex-direction: column; height: 100dvh; min-height: 420px; }
    main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

    .page-intro {
      flex: none;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 22px 20px 0;
    }
    .page-title { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: 0.01em; }
    .page-desc { margin: 4px 0 0; font-size: 13.5px; color: var(--c-text-2); max-width: 640px; }

    /* ============ 聊天卡片 ============ */
    .chat-card {
      flex: 1 1 auto;
      min-height: 0;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 20px 20px;
      display: flex;
      flex-direction: column;
    }
    .chat-panel {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--c-panel);
      border: 1px solid var(--c-line);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-panel);
      overflow: hidden;
    }

    /* 会话流 */
    .thread {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 22px 12px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }
    .msg { display: flex; gap: 10px; align-items: flex-start; animation: msg-in 0.28s ease both; }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: none; }
    }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    .avatar svg { width: 15px; height: 15px; }
    .avatar-ai { background: var(--c-accent); color: #fff; box-shadow: 0 2px 6px -2px rgba(47, 84, 235, 0.5); }
    .avatar-user { background: var(--c-line-soft); color: var(--c-text-2); border: 1px solid var(--c-line); }
    .msg-body { display: flex; flex-direction: column; gap: 4px; max-width: min(78%, 660px); min-width: 0; }
    .msg.user .msg-body { align-items: flex-end; }
    .msg-who { font-size: 11.5px; color: var(--c-text-3); padding: 0 4px; }
    .bubble {
      padding: 10px 14px;
      border-radius: var(--r-md);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      font-size: 14.5px;
      line-height: 1.7;
    }
    .bubble-ai {
      background: var(--c-bg);
      border: 1px solid var(--c-line-soft);
      border-top-left-radius: 5px;
    }
    .bubble-user {
      background: var(--c-accent);
      color: #fff;
      border-top-right-radius: 5px;
      box-shadow: var(--sh-float);
    }
    .bubble-error {
      background: var(--c-danger-soft);
      color: var(--c-danger);
      border: 1px solid #f6d7d3;
      border-top-left-radius: 5px;
    }

    /* 建议问题 */
    .suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .suggest button {
      appearance: none;
      border: 1px solid var(--c-line);
      background: var(--c-panel);
      color: var(--c-text-2);
      font-size: 12.5px;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    }
    .suggest button:hover { border-color: var(--c-accent); color: var(--c-accent); background: var(--c-accent-soft); }
    .suggest button:active { transform: scale(0.98); }

    /* 处理进度状态条 */
    .status-line {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--c-text-3);
      font-size: 12.5px;
      min-height: 22px;
      margin: 0 22px 2px;
      padding: 3px 10px;
      border-radius: 8px;
      background: var(--c-bg);
      border: 1px dashed transparent;
    }
    .status-line::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: none;
      border-radius: 50%;
      background: var(--c-accent);
      opacity: 0.85;
    }
    .status-line.is-running::before { animation: pulse-dot 1.1s ease-in-out infinite; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.72); }
    }
    .status-line .status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 输入区 */
    .composer { flex: none; border-top: 1px solid var(--c-line); padding: 12px 16px 10px; background: var(--c-panel); }
    .composer-row { display: flex; gap: 10px; align-items: center; }
    .composer-input-wrap { position: relative; flex: 1 1 auto; }
    .composer-input-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--c-text-3);
      pointer-events: none;
    }
    #question {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 38px;
      font: inherit;
      font-size: 14px;
      color: var(--c-text);
      background: var(--c-bg);
      border: 1px solid var(--c-line);
      border-radius: var(--r-sm);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }
    #question::placeholder { color: #98a1af; }
    #question:hover { border-color: #cdd3de; }
    #question:focus {
      background: var(--c-panel);
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px var(--c-focus);
    }
    #send {
      flex: none;
      appearance: none;
      height: 44px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--c-accent);
      border: 1px solid var(--c-accent);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease;
    }
    #send svg { width: 15px; height: 15px; }
    #send:hover { background: var(--c-accent-hover); border-color: var(--c-accent-hover); }
    #send:active:not(:disabled) { transform: scale(0.97); }
    #send:disabled { background: #a9b6d8; border-color: #a9b6d8; cursor: not-allowed; box-shadow: none; }
    #send:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }

    .composer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      padding: 0 2px;
    }
    .session-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 12px;
      color: var(--c-text-3);
    }
    .session-chip::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: none;
      border-radius: 50%;
      background: var(--c-success);
      box-shadow: 0 0 0 2px rgba(12, 157, 109, 0.14);
    }
    #sid {
      display: inline-block;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
      font-size: 11.5px;
      color: var(--c-text-3);
    }
    .link-btn {
      appearance: none;
      border: 0;
      background: none;
      padding: 2px 4px;
      font-size: 12.5px;
      color: var(--c-text-3);
      cursor: pointer;
      border-radius: 6px;
      transition: color 0.15s ease;
    }
    .link-btn:hover { color: var(--c-danger); }
    .link-btn:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 1px; }

    /* 滚动条 */
    .thread::-webkit-scrollbar { width: 8px; }
    .thread::-webkit-scrollbar-thumb { background: #d4dae4; border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
    .thread::-webkit-scrollbar-thumb:hover { background: #b9c1cf; background-clip: content-box; }

    /* ============ 响应式 & 动效偏好 ============ */
    @media (max-width: 640px) {
      .topbar-inner { padding: 0 14px; }
      .brand-tag { display: none; }
      .page-intro { padding: 16px 14px 0; }
      .chat-card { padding: 10px 12px 12px; }
      .thread { padding: 16px 12px 8px; }
      .msg-body { max-width: 86%; }
      .page-desc { font-size: 13px; }
    }
    @media (max-height: 640px) {
      .page-intro { padding-top: 12px; }
      .page-desc { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .thread { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/import" aria-label="掌柜智库 首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-name">掌柜智库</span>
            <span class="brand-tag">教育版</span>
          </span>
        </a>
        <nav class="nav" aria-label="主导航">
          <a class="nav-item" href="/import">知识库导入</a>
          <a class="nav-item is-active" href="/query" aria-current="page">智能问答</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-intro">
        <h1 class="page-title">智能问答</h1>
        <p class="page-desc">基于教育知识库的检索增强问答，支持多轮对话与流式输出。回答由向量检索、重排序与生成模型协同完成。</p>
      </section>

      <section class="chat-card" aria-label="问答会话">
        <div class="chat-panel">
          <div id="chat" class="thread" role="log" aria-live="polite" aria-label="对话内容">
            <div class="msg assistant">
              <span class="avatar avatar-ai" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
              </span>
              <div class="msg-body">
                <span class="msg-who">知识库助手</span>
                <div class="bubble bubble-ai">你好，我是教育知识库助手。可以问我课程介绍、知识点、文档内容或题目信息。</div>
                <div class="suggest" aria-label="可尝试的问题">
                  <button type="button">Python 有哪些课程？</button>
                  <button type="button">Java 高频面试题</button>
                  <button type="button">MySQL 索引为什么快</button>
                </div>
              </div>
            </div>
            <div id="nodes" class="status-line" hidden>
              <span class="status-text"></span>
            </div>
          </div>

          <div class="composer">
            <div class="composer-row">
              <div class="composer-input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <input id="question" type="text" autocomplete="off" aria-label="输入问题" placeholder="输入问题，回车发送，例如：Python 有哪些课程？" />
              </div>
              <button id="send" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="22" y1="2" x2="11" y2="13"/>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
                <span>发送</span>
              </button>
            </div>
            <div class="composer-meta">
              <span class="session-chip" title="当前会话标识，用于多轮上下文">会话 ID：<code id="sid"></code></span>
              <button id="clear" class="link-btn" type="button">清空本会话历史</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      "use strict";

      const SID_KEY = "edu_query_session";
      const NODE_NAMES = {
        hyde_search: "假设性文档检索",
        vector_search: "向量检索",
        rrf: "多路召回融合",
        rerank: "语义重排序",
        web_search_mcp: "联网检索补充",
        item_name_confirm: "知识点归属确认",
        answer_output: "答案生成"
      };

      const thread = document.getElementById("chat");
      const nodesEl = document.getElementById("nodes");
      const statusText = nodesEl.querySelector(".status-text");
      const questionEl = document.getElementById("question");
      const sendEl = document.getElementById("send");
      const sidEl = document.getElementById("sid");

      let sessionId = localStorage.getItem(SID_KEY) || "";
      let busy = false;
      let liveEl = null; // 当前正在流式输出的助手消息

      function ensureSession() {
        if (!sessionId) {
          sessionId = crypto.randomUUID();
          localStorage.setItem(SID_KEY, sessionId);
        }
        sidEl.textContent = sessionId;
      }
      ensureSession();

      function nodeLabel(id) {
        return NODE_NAMES[id] || id;
      }

      function appendNodes(d) {
        const done = (d.done_list || []).map(nodeLabel);
        const running = (d.running_list || []).map(nodeLabel);
        let t = "";
        if (done.length) t += "已完成：" + done.join("、");
        if (running.length) t += (t ? "　" : "") + "正在执行：" + running.join("、");
        statusText.textContent = t || "任务进行中…";
        nodesEl.classList.toggle("is-running", running.length > 0);
      }

      function setNodes(text, running) {
        statusText.textContent = text;
        nodesEl.classList.toggle("is-running", !!running);
      }

      function scrollToBottom() {
        thread.scrollTop = thread.scrollHeight;
      }

      function showNodes() { nodesEl.hidden = false; }
      function hideNodes() {
        nodesEl.hidden = true;
        nodesEl.classList.remove("is-running");
        statusText.textContent = "";
      }

      function bubbleNode(className) {
        const el = document.createElement("div");
        el.className = "bubble " + className;
        return el;
      }

      function appendUserMessage(text) {
        const wrap = document.createElement("div");
        wrap.className = "msg user";
        wrap.dataset.role = "user";

        const avatar = document.createElement("span");
        avatar.className = "avatar avatar-user";
        avatar.setAttribute("aria-hidden", "true");
        avatar.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' +
          "</svg>";

        const body = document.createElement("div");
        body.className = "msg-body";
        const who = document.createElement("span");
        who.className = "msg-who";
        who.textContent = "我";
        const bubble = bubbleNode("bubble-user");
        bubble.textContent = text;
        body.appendChild(who);
        body.appendChild(bubble);

        wrap.appendChild(avatar);
        wrap.appendChild(body);
        return wrap;
      }

      function appendAssistantLive() {
        const wrap = document.createElement("div");
        wrap.className = "msg assistant";
        wrap.dataset.role = "assistant";

        const avatar = document.createElement("span");
        avatar.className = "avatar avatar-ai";
        avatar.setAttribute("aria-hidden", "true");
        avatar.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>' +
          "</svg>";

        const body = document.createElement("div");
        body.className = "msg-body";
        const who = document.createElement("span");
        who.className = "msg-who";
        who.textContent = "知识库助手";
        const bubble = bubbleNode("bubble-ai");
        body.appendChild(who);
        body.appendChild(bubble);

        wrap.appendChild(avatar);
        wrap.appendChild(body);
        return { wrap: wrap, bubble: bubble };
      }

      function showLiveError(message) {
        if (!liveEl) return;
        liveEl.classList.remove("bubble-ai");
        liveEl.classList.add("bubble-error");
        liveEl.textContent = message;
      }

      async function ask() {
        const question = questionEl.value.trim();
        if (!question || busy) return;

        busy = true;
        sendEl.disabled = true;
        questionEl.value = "";

        // 用户消息
        const userMsg = appendUserMessage(question);
        thread.insertBefore(userMsg, nodesEl);

        // 当前回答消息（nodes 作为哨兵，保持“最新消息在最下方”）
        const live = appendAssistantLive();
        thread.insertBefore(live.wrap, nodesEl);
        liveEl = live.bubble;

        showNodes();
        setNodes("正在创建处理任务…", true);
        scrollToBottom();

        let resp;
        try {
          resp = await fetch("/query/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, question: question, is_stream: true })
          });
        } catch (e) {
          showLiveError("请求失败：" + e.message);
          hideNodes();
          finishTurn();
          return;
        }
        if (!resp.ok) {
          showLiveError("服务端错误 HTTP " + resp.status);
          hideNodes();
          finishTurn();
          return;
        }

        let data;
        try {
          data = await resp.json();
        } catch (e) {
          showLiveError("响应解析失败：" + e.message);
          hideNodes();
          finishTurn();
          return;
        }

        let finalized = false;
        const es = new EventSource("/query/stream/" + data.task_id);

        es.addEventListener("progress", function (e) {
          try { appendNodes(JSON.parse(e.data)); } catch (_) { /* 忽略畸形帧 */ }
          scrollToBottom();
        });

        es.addEventListener("delta", function (e) {
          try {
            const delta = JSON.parse(e.data).delta || "";
            if (delta) liveEl.textContent += delta;
          } catch (_) { /* 忽略畸形帧 */ }
          scrollToBottom();
        });

        es.addEventListener("final", function (e) {
          finalized = true;
          try {
            const payload = JSON.parse(e.data);
            if (payload.error && !payload.answer) {
              liveEl.classList.remove("bubble-ai");
              liveEl.classList.add("bubble-error");
              liveEl.textContent = payload.error;
            } else if (payload.answer) {
              liveEl.textContent = payload.answer;
            }
          } catch (_) { /* 忽略畸形帧 */ }
          es.close();
          hideNodes();
          finishTurn();
          scrollToBottom();
        });

        es.onerror = function () {
          es.close();
          if (!finalized) {
            hideNodes();
            finishTurn();
          }
        };
      }

      function finishTurn() {
        busy = false;
        sendEl.disabled = false;
        liveEl = null;
        questionEl.focus();
      }

      sendEl.addEventListener("click", ask);
      questionEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); ask(); }
      });

      // 建议问题：点击填入输入框
      thread.querySelectorAll(".suggest button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          questionEl.value = btn.textContent.trim();
          questionEl.focus();
        });
      });

      // 清空会话（服务端历史 + 页面消息）
      document.getElementById("clear").addEventListener("click", async function () {
        hideNodes();
        thread.querySelectorAll("[data-role]").forEach(function (node) {
          node.remove();
        });
        liveEl = null;
        try {
          await fetch("/query/history/clear", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId })
          });
        } catch (_) { /* 忽略：服务端失败不阻塞本地清空 */ }
        questionEl.focus();
      });
    })();
  </script>
</body>
</html>
